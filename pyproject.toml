[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omabridge"
version = "0.4.2"
description = "Citrix StoreFront launcher for the Omarchy bar"
readme = "README.md"
authors = [{name = "FlatHack"}]
keywords = ["omarchy", "citrix", "storefront", "totp", "quickshell"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "SecretStorage>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/flathack/OmaBridge"
Repository = "https://github.com/flathack/OmaBridge"
Issues = "https://github.com/flathack/OmaBridge/issues"

[project.scripts]
omabridge = "omabridge.__main__:main"

[tool.setuptools.package-data]
omabridge = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
