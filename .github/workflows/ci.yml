name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      # Only for isolated CI runners; the installed app keeps its sandbox.
      QTWEBENGINE_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64 libxcb-cursor0
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Verify hash-locked fresh installation
        run: python -I scripts/check-install.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check shell syntax and whitespace
        run: |
          bash -n scripts/install.sh scripts/run.sh scripts/check-plugin.sh
          git show --format= --check HEAD
      - name: Build source archive and wheel
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omabridge-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
